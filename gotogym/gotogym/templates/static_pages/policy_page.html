{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container mx-auto max-w-3xl py-12 px-4">
  <p class="inline-block mb-4 px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-semibold">
    {% trans "Contenido provisional, sujeto a revisión" %}
  </p>
  <h1 class="text-3xl font-bold text-[#093f62] mb-6">{{ title }}</h1>
  {% for paragraph in paragraphs %}
  <p class="mb-4 text-gray-700 leading-relaxed">{{ paragraph }}</p>
  {% endfor %}
  <a href="{% url 'home' %}" class="inline-block mt-6 text-[#093f62] hover:underline">&larr; {% trans "Volver al inicio" %}</a>
</div>
{% endblock %}
