{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center px-4 py-16 gtg-page">
  <div class="max-w-3xl w-full text-center gtg-card rounded-3xl shadow-xl p-10">
    <h1 class="text-4xl md:text-5xl font-bold text-white">{{ title }}</h1>
    <p class="mt-5 text-lg text-gray-300">{{ subtitle }}</p>
    <a href="{% url 'home' %}" class="gtg-btn gtg-btn-primary mt-8 inline-block px-6 py-3 rounded-full font-bold shadow transition-all">
      {% trans "Volver al inicio" %}
    </a>
  </div>
</section>
{% endblock %}
