{% extends '_base_dasboard.html' %}
{% block title %}Marca: {{ marca.name }}{% endblock %}
{% block content %}
<div class="container mx-auto py-8">
  <div class="gtg-card rounded-xl shadow p-8 max-w-lg mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-white">Previsualización de Marca</h1>
    <div class="mb-4">
      <span class="font-bold">ID:</span> {{ marca.id }}
    </div>
    <div class="mb-4">
      <span class="font-bold">Nombre:</span> {{ marca.name }}
    </div>
    <a href="{% url 'products:brand_list' %}" class="gtg-btn gtg-btn-primary inline-block py-2 px-6 rounded-xl shadow transition-all">Volver al listado</a>
  </div>
</div>
{% endblock %}
