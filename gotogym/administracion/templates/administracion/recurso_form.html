{% extends "administracion/base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Programa de afiliados</p>
    <h1>{% if recurso %}Editar recurso{% else %}Nuevo recurso{% endif %}</h1>
  </div>
</section>
<form class="panel form-grid" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% for field in form %}
    <label>
      <span>{{ field.label }}</span>
      {{ field }}
      {{ field.errors }}
    </label>
  {% endfor %}
  <div class="form-actions">
    <a class="ghost" href="{% url 'admin_recursos' %}">Cancelar</a>
    <button class="button" type="submit">Guardar</button>
  </div>
</form>
{% endblock %}
