<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vincular cuenta</title></head>
<body>
<main style="max-width:28rem;margin:3rem auto;padding:0 1rem;font-family:sans-serif">
  <h1>Ya tienes una cuenta</h1>
  <p>Existe una cuenta con el correo <strong>{{ email }}</strong>. Para usar tu cuenta GoToGym con ella, confirma tu contrasena actual.</p>
  {% if error %}<p role="alert" style="color:#b00020">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Contrasena<br><input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <p><button type="submit">Vincular y continuar</button></p>
  </form>
</main>
</body>
</html>
