{% load i18n %}
<div class="social-row" data-social-row>
  <label class="social-row__platform">
    <span>{% trans "Red social" %}</span>
    {{ f.platform }}
    {% if f.platform.errors %}<small class="field-error" role="alert">{{ f.platform.errors|join:" " }}</small>{% endif %}
  </label>
  <label class="social-row__other"{% if f.platform.value != 'other' %} hidden{% endif %}>
    <span>{% trans "Nombre de la red" %}</span>
    {{ f.other_name }}
    {% if f.other_name.errors %}<small class="field-error" role="alert">{{ f.other_name.errors|join:" " }}</small>{% endif %}
  </label>
  <label class="social-row__user">
    <span>{% trans "Usuario" %}</span>
    {{ f.username }}
    {% if f.username.errors %}<small class="field-error" role="alert">{{ f.username.errors|join:" " }}</small>{% endif %}
  </label>
  <label class="social-row__followers">
    <span>{% trans "Seguidores" %}</span>
    {{ f.followers }}
    {% if f.followers.errors %}<small class="field-error" role="alert">{{ f.followers.errors|join:" " }}</small>{% endif %}
  </label>
  <div class="social-row__action">{% if removible %}<button type="button" class="ghost btn-sm" data-remove-social aria-label="{% trans 'Quitar esta red' %}">{% trans "Quitar" %}</button>{% endif %}</div>
</div>
