{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="gtg-auth-page py-12 px-4">
  <div class="gtg-auth-card p-8">
    <h2 class="text-2xl font-bold mb-4 text-white">{% trans "Restablecer contraseña" %}</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="text-gray-200">{{ form.as_p }}</div>
      <button type="submit" class="gtg-btn gtg-btn-primary w-full">{% trans "Enviar correo de restablecimiento" %}</button>
    </form>
  </div>
</div>
{% endblock %}
