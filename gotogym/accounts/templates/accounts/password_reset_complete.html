{% extends 'base.html' %}
{% load i18n %}
{% load static %}

{% block title %}Contraseña restablecida{% endblock %}
{% block content %}
<div class="gtg-auth-page py-12 px-4">
  <div class="gtg-auth-card p-10 rounded-3xl w-full max-w-lg relative animate-fade-in-scale flex flex-col items-center">
    <img src="{% static 'images/Logo GoToGym 2.png' %}" alt="Logo GoToGym" class="w-16 h-16 object-contain mb-4 drop-shadow-lg" />
    <h2 class="text-2xl font-extrabold text-white mb-2 tracking-tight drop-shadow">¡Contraseña restablecida!</h2>
    <p class="text-gray-300 text-center mb-2">Tu contraseña ha sido cambiada correctamente. Ya puedes acceder a tu cuenta VIP.</p>
    <a href="{% url 'commercial_login' %}" class="gtg-btn gtg-btn-primary mt-8 text-lg font-bold transition">Iniciar sesión</a>
  </div>
</div>
<style>
@keyframes fade-in-scale {
  0% { opacity: 0; transform: scale(0.92) translateY(40px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.animate-fade-in-scale {
  animation: fade-in-scale 0.8s cubic-bezier(0.23, 1, 0.32, 1);
}
</style>
{% endblock %}
