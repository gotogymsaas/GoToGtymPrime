{% extends 'base.html' %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Editar Perfil" %}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10 gtg-card rounded-xl shadow-lg p-8">
  <h2 class="text-2xl font-bold mb-6 text-center text-white">{% trans "Editar Perfil" %}</h2>
  <form method="post" enctype="multipart/form-data" class="space-y-5">
    {% csrf_token %}
    <div>
      <label for="id_first_name" class="gtg-label">{% trans "Nombre" %}</label>
      <input type="text" name="first_name" id="id_first_name" value="{{ user.first_name }}" class="gtg-input" required>
    </div>
    <div>
      <label for="id_last_name" class="gtg-label">{% trans "Apellido" %}</label>
      <input type="text" name="last_name" id="id_last_name" value="{{ user.last_name }}" class="gtg-input" required>
    </div>
    <div>
      <label for="id_email" class="gtg-label">Email</label>
      <input type="email" name="email" id="id_email" value="{{ user.email }}" class="gtg-input" required>
    </div>
    <div>
      <label for="id_password" class="gtg-label">{% trans "Nueva contraseña" %} <span class="text-xs text-gray-400">({% trans "opcional" %})</span></label>
      <input type="password" name="password" id="id_password" class="gtg-input">
    </div>
    <div class="flex justify-between mt-8">
      <a href="/" class="gtg-btn gtg-btn-outline px-4 py-2 rounded-full font-semibold shadow-sm transition-all">{% trans "Volver" %}</a>
      <button type="submit" class="gtg-btn gtg-btn-primary px-6 py-2 rounded-full font-bold shadow-md transition-all">{% trans "Guardar cambios" %}</button>
    </div>
  </form>
</div>
{% endblock %}
