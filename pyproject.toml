[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = [
    "*/migrations/*",
    "GoToGymAdmin",
    "go-to-gym-platform",
    "node_modules",
    "staticfiles",
]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle basicos. I: import ordering. UP: sintaxis
# moderna de Python. B: bugbear (errores comunes que pyflakes no ve).
# DJ: reglas especificas de Django (flake8-django).
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",  # line-length ya lo controla `line-length` de arriba; no duplicar el aviso.
]

[tool.ruff.lint.per-file-ignores]
# settings*.py hace `from .settings import *` a proposito (ver el propio
# comentario en settings_local.py/settings_test.py); F403/F405 son ruido
# aqui, no un error real.
"gotogym/gotogym/settings_local.py" = ["F403", "F405"]
"gotogym/gotogym/settings_test.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
# manage.py vive en gotogym/ (no en la raiz del repo, donde esta este
# pyproject.toml): los imports reales -- "import products",
# "import gotogym.settings_test" -- resuelven contra esa carpeta, no
# contra la raiz. Sin esto mypy no encuentra ni las apps ni el modulo de
# settings.
mypy_path = "gotogym"
exclude = ["migrations/", "GoToGymAdmin", "go-to-gym-platform"]
# Permisivo a proposito, no por backlog pendiente (el backlog inicial de
# 17 errores ya se corrigio: mypy bloquea el build en
# run_backend_checks.sh). --strict sobre un codebase de 600+ archivos sin
# anotar generaria miles de avisos de tipos faltantes, no una senal util
# -- esto se endurece de a poco, app por app.
ignore_missing_imports = true
check_untyped_defs = false

[tool.django-stubs]
django_settings_module = "gotogym.settings_test"

[tool.coverage.run]
# "." y no "gotogym": coverage corre con cwd=gotogym/ (ahi vive manage.py,
# ver run_backend_checks.sh), no en la raiz del repo donde esta este
# archivo. "gotogym" aqui apuntaria a gotogym/gotogym/ -- el paquete de
# settings, no las apps -- y el reporte solo mediria eso.
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "*/__init__.py",
    "gotogym/settings*.py",
    "manage.py",
    "gotogym/wsgi.py",
    "gotogym/asgi.py",
]

[tool.coverage.report]
skip_empty = true
precision = 1

[tool.importlinter]
root_packages = [
    "accounts", "administracion", "analitica", "blog", "carrito", "contabilidad",
    "gotogym", "influencer", "inventory", "orders", "payments", "products",
    "shipping", "tienda",
]
include_external_packages = false

# Las pruebas y las migraciones cruzan apps con libertad: no son codigo de la
# aplicacion, y una migracion apunta a otra app por su estado historico.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Las apps dependen hacia abajo y sin ciclos"
type = "layers"
layers = [
    # Composicion: enruta y arma las paginas del sitio.
    "gotogym.urls",
    "gotogym.views | gotogym.sitemaps",
    # Paneles internos: leen de casi todo, nadie depende de ellos.
    "administracion | contabilidad",
    "accounts | payments | influencer",
    "orders",
    "carrito",
    "shipping",
    "tienda | inventory | analitica | blog",
    "products",
    # Utilidades compartidas: no pueden conocer ninguna app.
    "gotogym.seo | gotogym.ratelimit | gotogym.tasks",
]
ignore_imports = [
    # Pruebas que preparan datos de otra app. Son lecturas de apoyo, no una
    # dependencia del codigo de la aplicacion.
    "products.test_commands -> administracion.management.commands.seed_initial_data",
    "products.test_commands -> inventory.models",
    "tienda.tests -> inventory.models",
    "tienda.test_pdp -> inventory.models",
    "tienda.test_imagen_producto -> inventory.models",
    "orders.tests -> payments.models",
    "orders.tests -> payments.providers.mock",
    "orders.tests -> accounts.models",
    "orders.test_security_hardening -> payments.models",
    "influencer.tests -> administracion.permissions",
    # Ciclos que ya existian al introducir la regla. Cada uno es deuda
    # conocida: la regla impide que aparezcan nuevos, y estos se quitan al
    # resolverlos (no se agregan otros sin discutirlo).
    #
    # Al crear un pedido se registra la comision del afiliado, pero el
    # afiliado lee pedidos. Se resuelve con una senal que el pedido emita.
    "orders.services -> influencer.services",
    # Un envio apunta a su pedido, y el pedido calcula su envio.
    "shipping.models -> orders.models",
    # El comando de auditoria lee el inventario de cada producto.
    "products.management.commands.audit_catalog -> inventory.models",
]

[[tool.importlinter.contracts]]
name = "Las utilidades compartidas de gotogym no conocen ninguna app"
type = "forbidden"
source_modules = ["gotogym.seo", "gotogym.ratelimit", "gotogym.tasks"]
forbidden_modules = [
    "accounts", "administracion", "analitica", "blog", "carrito", "contabilidad",
    "influencer", "inventory", "orders", "payments", "products", "shipping", "tienda",
]
