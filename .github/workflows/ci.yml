name: CI

# Se ejecuta en cada pull request y lo reutiliza el workflow de despliegue,
# de modo que lo que llega a produccion paso exactamente estas pruebas.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Validacion y suite completa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # ruff, import-linter, mypy, migraciones pendientes, check --deploy y
      # todas las pruebas con cobertura.
      - name: Validaciones del backend
        env:
          # Piso de cobertura: medido 93.8 % con la suite completa; se deja un
          # margen de 3 puntos. Solo se sube cuando sube la cobertura (ver
          # environments/README.md).
          COVERAGE_FAIL_UNDER: 90
        run: bash environments/backend/run_backend_checks.sh

      - name: Pruebas de las herramientas de identidad
        run: |
          source .venv-backend-test/bin/activate
          python3 -m unittest discover -s scripts/identity -p 'test*.py' -v

  dependencias:
    name: Vulnerabilidades conocidas en dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informa sin bloquear: una vulnerabilidad nueva en una libreria no debe
    # impedir un despliegue que no la introduce. pip-audit no distingue la
    # severidad (ni su salida ni sus opciones la incluyen: solo se puede
    # ignorar un identificador concreto con --ignore-vuln), asi que no hay
    # forma de bloquear solo las altas o criticas. El resultado queda escrito
    # en el resumen del job para revisarlo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install pip-audit

      - name: Auditar requirements.txt
        run: |
          status=0
          pip-audit -r requirements.txt --progress-spinner off -f markdown -o pip-audit.md || status=$?
          {
            echo '## pip-audit: vulnerabilidades conocidas en requirements.txt'
            echo
            if [ "$status" -eq 0 ]; then
              echo 'Sin vulnerabilidades conocidas.'
            else
              cat pip-audit.md 2>/dev/null || echo 'pip-audit termino con error y no genero informe; ver el log del paso.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  postgres:
    name: Pruebas contra PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotogym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Las apps que mueven dinero e inventario, y las pruebas de
      # concurrencia, que solo tienen sentido con bloqueos de fila reales.
      - name: Pruebas de dinero e inventario en PostgreSQL
        working-directory: gotogym
        run: >-
          python manage.py test
          orders payments inventory afiliados gotogym.test_ratelimit
          --parallel 2
          --settings=gotogym.settings_test_postgres
