name: CI

# Se ejecuta en cada pull request y lo reutiliza el workflow de despliegue,
# de modo que lo que llega a produccion paso exactamente estas pruebas.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Validacion y suite completa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ruff, import-linter, mypy, migraciones pendientes, check --deploy y
      # todas las pruebas con cobertura.
      - name: Validaciones del backend
        run: bash environments/backend/run_backend_checks.sh

      - name: Pruebas de las herramientas de identidad
        run: |
          source .venv-backend-test/bin/activate
          python3 -m unittest discover -s scripts/identity -p 'test*.py' -v

  dependencias:
    name: Vulnerabilidades conocidas en dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informa sin bloquear: una vulnerabilidad nueva en una libreria no debe
    # impedir un despliegue que no la introduce. Se revisa en el resumen.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pip-audit

      - run: pip-audit -r requirements.txt

  postgres:
    name: Pruebas contra PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotogym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Las apps que mueven dinero e inventario, y las pruebas de
      # concurrencia, que solo tienen sentido con bloqueos de fila reales.
      - name: Pruebas de dinero e inventario en PostgreSQL
        working-directory: gotogym
        run: >-
          python manage.py test
          orders payments inventory afiliados gotogym.test_ratelimit
          --parallel 2
          --settings=gotogym.settings_test_postgres
