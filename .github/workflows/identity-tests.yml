name: Universal Identity Prime integration
on: [push, pull_request]
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check gotogym
      - run: mypy gotogym
        env:
          DJANGO_SETTINGS_MODULE: gotogym.settings_test
      - run: PYTHONPATH=. lint-imports --config ../pyproject.toml
        working-directory: gotogym
      - run: python manage.py test accounts --settings=gotogym.settings_test
        working-directory: gotogym
