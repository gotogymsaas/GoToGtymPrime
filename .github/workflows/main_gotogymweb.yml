# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - gotogym-prime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: gotogym-prime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend validation suite
        run: bash environments/backend/run_backend_checks.sh

      - name: Enforce design governance baseline
        run: |
          set -euo pipefail
          chmod +x environments/frontend/check_design_governance.sh
          bash environments/frontend/check_design_governance.sh

      - name: Prepare static artifacts
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py migrate --settings=gotogym.settings_local
          python manage.py collectstatic --noinput --settings=gotogym.settings_local

      - name: Run frontend smoke checks
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py runserver 127.0.0.1:8000 --settings=gotogym.settings_local > /tmp/django-ci.log 2>&1 &
          DJANGO_PID=$!
          trap 'kill $DJANGO_PID || true' EXIT
          sleep 6
          cd ..
          bash environments/frontend/run_frontend_smoke.sh

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.venv-backend-test/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App via Kudu Zip Deploy
        env:
          SCM_USER: ${{ secrets.AZURE_SCM_USER }}
          SCM_PASS: ${{ secrets.AZURE_SCM_PASS }}
          APP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          echo "Comprimiendo artefactos..."
          zip -r deploy.zip . -x "*.pyc" -x ".venv*" -x "venv/*" -x "__pycache__/*" -x ".git/*"
          echo "Tamaño del paquete: $(du -sh deploy.zip | cut -f1)"
          echo "Enviando a Kudu zipdeploy..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deploy.zip)
          echo "Respuesta HTTP: $HTTP_STATUS"
          cat /tmp/deploy_response.txt || true
          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "Deploy exitoso."
          else
            echo "ERROR: Deploy falló con HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Aplicando migraciones de produccion..."
          MIGRATE_STATUS=$(curl -s -o /tmp/migrate_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/command" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/json" \
            --data '{"command":"python gotogym/manage.py migrate --noinput","dir":"/home/site/wwwroot"}')
          echo "Respuesta HTTP migraciones: $MIGRATE_STATUS"
          cat /tmp/migrate_response.txt || true
          if [[ "$MIGRATE_STATUS" -lt 200 || "$MIGRATE_STATUS" -ge 300 ]]; then
            echo "ERROR: Migraciones fallaron con HTTP $MIGRATE_STATUS"
            exit 1
          fi
          if ! grep -Eq '"ExitCode"[[:space:]]*:[[:space:]]*0' /tmp/migrate_response.txt; then
            echo "ERROR: El comando de migraciones no termino correctamente."
            exit 1
          fi
          echo "Migraciones aplicadas."
