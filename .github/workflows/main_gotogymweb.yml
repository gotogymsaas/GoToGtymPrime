# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - gotogym-prime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: gotogym-prime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Las mismas validaciones y la suite completa que corren en cada pull
  # request (ver ci.yml). Si fallan, no se construye ni se despliega nada.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m venv .venv-backend-test
          source .venv-backend-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Enforce design governance baseline
        run: |
          set -euo pipefail
          chmod +x environments/frontend/check_design_governance.sh
          bash environments/frontend/check_design_governance.sh

      - name: Prepare static artifacts
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py migrate --settings=gotogym.settings_local
          python manage.py collectstatic --noinput --settings=gotogym.settings_local

      - name: Run frontend smoke checks
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py runserver 127.0.0.1:8000 --settings=gotogym.settings_local > /tmp/django-ci.log 2>&1 &
          DJANGO_PID=$!
          trap 'kill $DJANGO_PID || true' EXIT
          sleep 6
          cd ..
          bash environments/frontend/run_frontend_smoke.sh

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.venv-backend-test/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    # Un solo despliegue a la vez: dos pushes seguidos no se pisan, el segundo
    # espera. Sin cancelar el que va en curso (cortar un zipdeploy a medias
    # deja la aplicacion en un estado raro).
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    # Entorno `production` de GitHub: hoy sin reglas, pero permite exigir una
    # aprobacion manual antes de desplegar (Settings > Environments >
    # production > Required reviewers) sin tocar este archivo.
    environment:
      name: production
      url: https://shop.gotogym.store

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: python-app

      - name: Deploy to Azure Web App via Kudu Zip Deploy
        env:
          SCM_USER: ${{ secrets.AZURE_SCM_USER }}
          SCM_PASS: ${{ secrets.AZURE_SCM_PASS }}
          APP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail

          echo "Verificando script de arranque..."
          test -f environments/azure/startup.sh

          echo "Comprimiendo artefactos..."
          zip -r deploy.zip . \
            -x "*.pyc" -x ".venv*" -x "venv/*" -x "__pycache__/*" -x ".git/*" \
            -x ".github/*" -x "docs/*" -x "*.sqlite3" -x "*.bat" -x "deploy.zip"
          echo "Tamaño del paquete: $(du -sh deploy.zip | cut -f1)"

          echo "Verificando contenido del paquete..."
          unzip -l deploy.zip | grep -F "environments/azure/startup.sh"

          echo "Enviando a Kudu zipdeploy..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deploy.zip)
          echo "Respuesta HTTP: $HTTP_STATUS"
          cat /tmp/deploy_response.txt || true
          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "Deploy exitoso."
          else
            echo "ERROR: Deploy falló con HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Esperando a que Kudu termine de publicar..."
          for _ in $(seq 1 30); do
            LATEST=$(curl -s -u "${SCM_USER}:${SCM_PASS}" \
              "https://${APP_NAME}.scm.azurewebsites.net/api/deployments/latest" || echo '{}')
            DEPLOY_COMPLETE=$(echo "$LATEST" | jq -r '.complete // false')
            DEPLOY_STATE=$(echo "$LATEST" | jq -r '.status // -1')
            echo "Estado del despliegue: complete=${DEPLOY_COMPLETE} status=${DEPLOY_STATE}"
            if [[ "$DEPLOY_COMPLETE" == "true" ]]; then
              if [[ "$DEPLOY_STATE" == "3" ]]; then
                echo "ERROR: Kudu reporta el despliegue como fallido."
                exit 1
              fi
              break
            fi
            sleep 10
          done

          # Las migraciones corren en environments/azure/startup.sh, dentro del
          # contenedor de la app: es el unico lugar con el codigo extraido, el
          # virtualenv y las app settings. Kudu solo ve output.tar.zst.
          echo "Verificando que el sitio responda..."
          SITE_UP=0
          for _ in $(seq 1 12); do
            SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://${APP_NAME}.azurewebsites.net/" || echo "000")
            echo "Estado del sitio: HTTP ${SITE_STATUS}"
            if [[ "$SITE_STATUS" -ge 200 && "$SITE_STATUS" -lt 400 ]]; then
              SITE_UP=1
              break
            fi
            if [[ "$SITE_STATUS" -ge 400 && "$SITE_STATUS" -lt 500 ]]; then
              echo "AVISO: el sitio responde ${SITE_STATUS}. Revisa ALLOWED_HOSTS o el routing."
              SITE_UP=1
              break
            fi
            sleep 15
          done
          if [[ "$SITE_UP" -ne 1 ]]; then
            echo "ERROR: el sitio no respondio tras el despliegue."
            echo "Revisa los logs de arranque: az webapp log tail -g rg-gotogym-prime -n ${APP_NAME}"
            exit 1
          fi
          echo "Despliegue verificado."
          echo "Verificando preparación OIDC pública sin revelar configuración..."
          ID_STATUS=$(curl -sS --max-time 30 -o /tmp/prime-identity-status.json -w "%{http_code}" \
            "https://shop.gotogym.store/accounts/identity/status/" || echo "000")
          if [[ "$ID_STATUS" != "200" ]]; then
            echo "ERROR: /accounts/identity/status/ no respondió 200 (HTTP $ID_STATUS)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/prime-identity-status.json', encoding='utf-8') as fh:
              response = json.load(fh)
          assert isinstance(response, dict), 'identity status must be a JSON object'
          assert all(type(response.get(key)) is bool for key in ('enabled','ready','canary')), 'invalid identity status schema'
          print('OIDC status endpoint: HTTP 200, boolean fields validated (values withheld)')
          PY
          # Kudu zipdeploy can complete before all Gunicorn workers restart.
          # 404 here can be an old worker still serving the previous routes.
          echo "Esperando la nueva ruta protegida de diagnóstico (sin sesiones ni secretos)..."
          PROTECTED_READY=0
          for _ in $(seq 1 18); do
            ADMIN_STATUS=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" \
              "https://shop.gotogym.store/accounts/identity/preflight/" || echo "000")
            case "$ADMIN_STATUS" in
              302|303|403)
                echo "Diagnóstico administrativo protegido: HTTP $ADMIN_STATUS"
                PROTECTED_READY=1
                break
                ;;
              200)
                echo "ERROR DE SEGURIDAD: la ruta administrativa respondió HTTP 200 sin sesión."
                exit 1
                ;;
              *)
                echo "La ruta aún no está disponible (HTTP $ADMIN_STATUS); reintentando..."
                sleep 10
                ;;
            esac
          done
          if [[ "$PROTECTED_READY" -ne 1 ]]; then
            echo "ERROR: la ruta administrativa no apareció después de esperar el reinicio."
            echo "Comprobar imagen/código publicado, startup real y logs de Gunicorn, sin activar Universal Identity."
            exit 1
          fi
          echo "Smokes OIDC posteriores al despliegue: correctos."
