name: QAF shadow integration contracts
on:
  pull_request:
    paths: ['.github/qaf/**', '.github/workflows/qaf-shadow*', 'tests/qaf_shadow/**']
  push:
    branches: [main]
    paths: ['.github/qaf/**', '.github/workflows/qaf-shadow*', 'tests/qaf_shadow/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s tests/qaf_shadow -v
