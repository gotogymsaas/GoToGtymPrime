name: Build and deploy Python app to Azure Web App - api.gotogym.store

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: app-gotogym-api-green-pnvfv3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend validation suite
        run: bash environments/backend/run_backend_checks.sh

      - name: Prepare static artifacts
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py migrate --settings=gotogym.settings_local
          python manage.py collectstatic --noinput --settings=gotogym.settings_local

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-api-app
          path: |
            .
            !venv/
            !.venv-backend-test/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-api-app

      - name: Deploy to Azure Web App via Kudu Zip Deploy
        env:
          SCM_USER: ${{ secrets.AZURE_API_SCM_USER }}
          SCM_PASS: ${{ secrets.AZURE_API_SCM_PASS }}
          APP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail

          echo "Verificando script de arranque..."
          test -f environments/azure/startup.sh

          echo "Comprimiendo artefactos..."
          zip -r deploy.zip . \
            -x "*.pyc" -x ".venv*" -x "venv/*" -x "__pycache__/*" -x ".git/*" \
            -x ".github/*" -x "docs/*" -x "*.sqlite3" -x "*.bat" -x "deploy.zip"
          echo "Tamano del paquete: $(du -sh deploy.zip | cut -f1)"

          echo "Verificando contenido del paquete..."
          unzip -l deploy.zip | grep -F "environments/azure/startup.sh"

          echo "Enviando a Kudu zipdeploy..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deploy.zip)
          echo "Respuesta HTTP: $HTTP_STATUS"
          cat /tmp/deploy_response.txt || true
          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "Deploy exitoso."
          else
            echo "ERROR: Deploy fallo con HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Esperando a que Kudu termine de publicar..."
          for _ in $(seq 1 30); do
            LATEST=$(curl -s -u "${SCM_USER}:${SCM_PASS}" \
              "https://${APP_NAME}.scm.azurewebsites.net/api/deployments/latest" || echo '{}')
            DEPLOY_COMPLETE=$(echo "$LATEST" | jq -r '.complete // false')
            DEPLOY_STATE=$(echo "$LATEST" | jq -r '.status // -1')
            echo "Estado del despliegue: complete=${DEPLOY_COMPLETE} status=${DEPLOY_STATE}"
            if [[ "$DEPLOY_COMPLETE" == "true" ]]; then
              if [[ "$DEPLOY_STATE" == "3" ]]; then
                echo "ERROR: Kudu reporta el despliegue como fallido."
                exit 1
              fi
              break
            fi
            sleep 10
          done

          # Las migraciones corren en environments/azure/startup.sh, dentro del
          # contenedor de la app: es el unico lugar con el codigo extraido, el
          # virtualenv y las app settings. Kudu solo ve output.tar.zst.
          echo "Verificando que el sitio responda..."
          SITE_UP=0
          for _ in $(seq 1 12); do
            SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://${APP_NAME}.azurewebsites.net/" || echo "000")
            echo "Estado del sitio: HTTP ${SITE_STATUS}"
            if [[ "$SITE_STATUS" -ge 200 && "$SITE_STATUS" -lt 400 ]]; then
              SITE_UP=1
              break
            fi
            if [[ "$SITE_STATUS" -ge 400 && "$SITE_STATUS" -lt 500 ]]; then
              echo "AVISO: el sitio responde ${SITE_STATUS}. Revisa ALLOWED_HOSTS o el routing."
              SITE_UP=1
              break
            fi
            sleep 15
          done
          if [[ "$SITE_UP" -ne 1 ]]; then
            echo "ERROR: el sitio no respondio tras el despliegue."
            echo "Revisa los logs de arranque: az webapp log tail -n ${APP_NAME}"
            exit 1
          fi
          echo "Despliegue verificado."
