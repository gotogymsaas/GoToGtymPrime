name: Build and deploy Python app to Azure Web App - api.gotogym.store

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: app-gotogym-api-green-pnvfv3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend validation suite
        run: bash environments/backend/run_backend_checks.sh

      - name: Prepare static artifacts
        run: |
          set -euo pipefail
          source .venv-backend-test/bin/activate
          cd gotogym
          python manage.py migrate --settings=gotogym.settings_local
          python manage.py collectstatic --noinput --settings=gotogym.settings_local

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-api-app
          path: |
            .
            !venv/
            !.venv-backend-test/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-api-app

      - name: Deploy to Azure Web App via Kudu Zip Deploy
        env:
          SCM_USER: ${{ secrets.AZURE_API_SCM_USER }}
          SCM_PASS: ${{ secrets.AZURE_API_SCM_PASS }}
          APP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail

          kudu_command() {
            jq -n --arg cmd "$1" --arg dir "/home/site/wwwroot" '{command: $cmd, dir: $dir}' > /tmp/kudu_payload.json
            curl -s -X POST \
              "https://${APP_NAME}.scm.azurewebsites.net/api/command" \
              -u "${SCM_USER}:${SCM_PASS}" \
              -H "Content-Type: application/json" \
              --data @/tmp/kudu_payload.json
          }

          echo "Verificando script de migraciones..."
          test -f environments/azure/run_production_migrations.sh

          echo "Comprimiendo artefactos..."
          zip -r deploy.zip . \
            -x "*.pyc" -x ".venv*" -x "venv/*" -x "__pycache__/*" -x ".git/*" \
            -x ".github/*" -x "docs/*" -x "*.sqlite3" -x "*.bat" -x "deploy.zip"
          echo "Tamano del paquete: $(du -sh deploy.zip | cut -f1)"

          echo "Verificando contenido del paquete..."
          unzip -l deploy.zip | grep -F "environments/azure/run_production_migrations.sh"

          echo "Enviando a Kudu zipdeploy..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deploy.zip)
          echo "Respuesta HTTP: $HTTP_STATUS"
          cat /tmp/deploy_response.txt || true
          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "Deploy exitoso."
          else
            echo "ERROR: Deploy fallo con HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Esperando a que Kudu termine de publicar..."
          for _ in $(seq 1 30); do
            LATEST=$(curl -s -u "${SCM_USER}:${SCM_PASS}" \
              "https://${APP_NAME}.scm.azurewebsites.net/api/deployments/latest" || echo '{}')
            DEPLOY_COMPLETE=$(echo "$LATEST" | jq -r '.complete // false')
            DEPLOY_STATE=$(echo "$LATEST" | jq -r '.status // -1')
            echo "Estado del despliegue: complete=${DEPLOY_COMPLETE} status=${DEPLOY_STATE}"
            if [[ "$DEPLOY_COMPLETE" == "true" ]]; then
              if [[ "$DEPLOY_STATE" == "3" ]]; then
                echo "ERROR: Kudu reporta el despliegue como fallido."
                exit 1
              fi
              break
            fi
            sleep 10
          done

          echo "=== Diagnostico: contenido real visible por Kudu ==="
          echo "--- ls -la /home/site/wwwroot ---"
          kudu_command "ls -la /home/site/wwwroot" || true
          echo "--- find manage.py ---"
          kudu_command "find /home/site/wwwroot -maxdepth 3 -name manage.py" || true
          echo "--- find run_production_migrations.sh ---"
          kudu_command "find /home/site/wwwroot -maxdepth 4 -name run_production_migrations.sh" || true
          echo "--- which python3 ---"
          kudu_command "which python3" || true
          echo "=== Fin del diagnostico ==="

          echo "Aplicando migraciones de produccion..."
          MIGRATE_PAYLOAD=$(jq -n \
            --arg cmd "bash /home/site/wwwroot/environments/azure/run_production_migrations.sh" \
            --arg dir "/home/site/wwwroot" \
            '{command: $cmd, dir: $dir}')
          MIGRATE_STATUS=$(curl -s -o /tmp/migrate_response.txt -w "%{http_code}" \
            -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/command" \
            -u "${SCM_USER}:${SCM_PASS}" \
            -H "Content-Type: application/json" \
            --data "$MIGRATE_PAYLOAD")
          echo "Respuesta HTTP migraciones: $MIGRATE_STATUS"
          cat /tmp/migrate_response.txt || true
          if [[ "$MIGRATE_STATUS" -lt 200 || "$MIGRATE_STATUS" -ge 300 ]]; then
            echo "ERROR: Migraciones fallaron con HTTP $MIGRATE_STATUS"
            exit 1
          fi
          if ! jq -e '.ExitCode == 0' /tmp/migrate_response.txt >/dev/null 2>&1; then
            echo "ERROR: El comando de migraciones no termino correctamente."
            exit 1
          fi
          echo "Migraciones aplicadas."
